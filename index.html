<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101815" />
    <meta
      name="description"
      content="Harmony Studio — compune progresii, explorează armonia și găsește acordurile pe chitară. Funcționează local, fără cont."

    <title>Guitar Composer Studio</title>
    <script id="offline-launcher">
      if (
        window.location.protocol === 'file:' &&
        !document.documentElement.hasAttribute('data-portable')

        window.location.replace(
          new URL('./portable/Guitar-Composer-Studio.html', window.location.href).href,
        );
      }
    </script>
  </head>
  <body>
    <div id="root">
      <p style="font: 16px system-ui; padding: 24px">
        Opening Guitar Composer Studio… If it does not start,
        <a href="./portable/Guitar-Composer-Studio.html">open the offline app</a>.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
